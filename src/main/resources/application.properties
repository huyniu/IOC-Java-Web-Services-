spring.application.name=IOC Java Web Services
# Cổng chạy server
server.port=8080

# Cấu hình kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/internship_db
spring.datasource.username=postgres
spring.datasource.password=271105
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình JWT Security
jwt.secret=ZGF5LWxhLWNodW9pLWtob2EtYmktbWF0LXJhdC1kYWktZGFuaC1jaG8tZHUtYW4tcXVhbi1seS10aHVjLXRhcC1jdWEtYmFu
# Thời gian sống của token: 24h (tính bằng milliseconds)
jwt.expiration=86400000
# JWT Refresh Token (7 days = 604800000 ms)
jwt.refresh-expiration=604800000

# LOGGING
logging.level.root=INFO
logging.level.com.example.intershipms=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
